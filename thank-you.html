<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Thank You | Savoria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #171717;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .thank-you {
            max-width: 550px;
        }

        .thank-you h1 {
            color: #d4a373;
            font-size: 42px;
            margin-bottom: 20px;
        }

        .thank-you p {
            color: #ccc;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .thank-you a {
            display: inline-block;
            padding: 14px 28px;
            background: #d4a373;
            color: #171717;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .thank-you a:hover {
            background: #fff;
        }
    </style>
</head>

<body>
    <main class="thank-you">
        <h1>Thank You!</h1>

        <p>
            Your message has been sent successfully.
            We appreciate you contacting Savoria
            and will get back to you soon.
        </p>

        <a href="index.html">Back to Home</a>
    </main>
</body>
</html>
